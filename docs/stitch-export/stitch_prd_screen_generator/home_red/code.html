<script>
    document.addEventListener('DOMContentLoaded', () => {
        const trailer = document.getElementById('mouse-trailer');
        
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return; // Don't run animation if reduced motion is preferred
        }

        let mouseX = 0;
        let mouseY = 0;
        let trailerX = 0;
        let trailerY = 0;
        let isHovering = false;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            if (!isHovering) {
                isHovering = true;
                trailer.classList.remove('opacity-0');
            }
        });

        document.addEventListener('mouseleave', () => {
            isHovering = false;
            trailer.classList.add('opacity-0');
        });

        function animate() {
            if (isHovering) {
                // Smoothing factor (lower is smoother/more lag)
                const easing = 0.15;
                
                trailerX += (mouseX - trailerX) * easing;
                trailerY += (mouseY - trailerY) * easing;
                
                trailer.style.transform = `translate(calc(${trailerX}px - 50%), calc(${trailerY}px - 50%))`;
            }
            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
