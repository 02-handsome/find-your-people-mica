<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    
    #mouse-trailer {
      background: radial-gradient(circle, rgba(211, 47, 47, 0.15) 0%, rgba(211, 47, 47, 0) 70%);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      will-change: transform;
      transition: opacity 0.3s ease;
    }
    
    @media (prefers-reduced-motion: reduce) {
      #mouse-trailer {
        display: none !important;
      }
    }
  </style>

<body class="bg-background text-on-surface font-body-lg antialiased min-h-screen">
<div class="fixed top-0 left-0 w-[60px] h-[60px] rounded-full opacity-0" id="mouse-trailer"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-on-surface">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-md mx-auto">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high border border-border-subtle flex items-center justify-center">
<!-- Empty state for avatar upload during setup -->
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="add_a_photo">add_a_photo</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed text-center flex-1">Setup Profile</h1>
<div class="w-10"></div> <!-- Placeholder for layout balance -->
</div>
</header>
<!-- Main Content -->
<main class="pt-20 pb-[100px] px-container-padding w-full max-w-md mx-auto space-y-stack-md flex flex-col h-full">
<p class="text-text-muted font-body-sm mb-4">Complete your profile to start connecting. Only share what you're comfortable with.</p>
<!-- Form Fields -->
<form class="space-y-stack-md flex-1">
<!-- Name Input -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-lowest border-border-subtle rounded-lg h-12 px-4 font-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all duration-200" id="fullName" placeholder="e.g. Alex Chen" type="text"/>
</div>
<!-- Year/Program Input -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="programYear">Program &amp; Year</label>
<input class="w-full bg-surface-container-lowest border-border-subtle rounded-lg h-12 px-4 font-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all duration-200" id="programYear" placeholder="e.g. PGP 1, Year 2" type="text"/>
</div>
<!-- Tags Picker -->
<div class="space-y-4 pt-2">
<div class="flex justify-between items-end">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Your Interests</label>
<span class="font-body-sm text-text-muted"><span id="tagCount">0</span>/3 Selected</span>
</div>
<div class="flex flex-wrap gap-2" id="tagContainer">
<!-- Javascript will handle the active state toggling, but we pre-render a few as active/inactive for UI demonstration -->
<button class="tag-btn h-10 px-4 rounded-full font-body-sm border border-border-subtle bg-surface-container-lowest text-text-muted transition-colors duration-200 hover:bg-surface-variant" data-selected="false" type="button">Photography</button>
<button class="tag-btn h-10 px-4 rounded-full font-body-sm border border-transparent bg-primary text-on-primary transition-colors duration-200" data-selected="true" type="button">Case Comps</button>
<button class="tag-btn h-10 px-4 rounded-full font-body-sm border border-border-subtle bg-surface-container-lowest text-text-muted transition-colors duration-200 hover:bg-surface-variant" data-selected="false" type="button">Running</button>
<button class="tag-btn h-10 px-4 rounded-full font-body-sm border border-border-subtle bg-surface-container-lowest text-text-muted transition-colors duration-200 hover:bg-surface-variant" data-selected="false" type="button">Coffee Runs</button>
<button class="tag-btn h-10 px-4 rounded-full font-body-sm border border-border-subtle bg-surface-container-lowest text-text-muted transition-colors duration-200 hover:bg-surface-variant" data-selected="false" type="button">Finance Club</button>
<button class="tag-btn h-10 px-4 rounded-full font-body-sm border border-transparent bg-primary text-on-primary transition-colors duration-200" data-selected="true" type="button">Design</button>
<button class="tag-btn h-10 px-4 rounded-full font-body-sm border border-border-subtle bg-surface-container-lowest text-text-muted transition-colors duration-200 hover:bg-surface-variant" data-selected="false" type="button">Badminton</button>
<button class="tag-btn h-10 px-4 rounded-full font-body-sm border border-transparent bg-primary text-on-primary transition-colors duration-200" data-selected="true" type="button">Startups</button>
</div>
<p class="font-body-sm text-text-muted text-sm" id="tagWarning" style="display: none; color: var(--error);">Please select exactly 3 tags.</p>
</div>
<div class="h-px w-full bg-border-subtle my-6"></div>

<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="contactHandle">Contact Handle</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted text-[20px]" data-icon="phone_iphone">phone_iphone</span>
</div>
<input class="w-full bg-surface-container-lowest border-border-subtle rounded-lg h-12 pl-10 pr-4 font-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all duration-200" id="contactHandle" placeholder="WhatsApp / Phone Number" type="text"/>
</div>
<!-- Privacy Notice -->
<div class="flex items-start gap-3 bg-primary-container rounded-lg p-4 mt-2">
<span class="material-symbols-outlined text-on-primary-container mt-0.5 text-[20px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-body-sm text-on-primary-container">
                        Your contact handle remains strictly hidden. It is only revealed when you mutually accept a connection request.
                    </p>
</div>
</div>
<!-- Spacer for bottom CTA -->
<div class="h-10"></div>
<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-background border-t border-border-subtle z-40">
<div class="max-w-md mx-auto">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-button-text text-button-text shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2" type="button">
                        Complete Setup
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</form>
</main>
<script>
        // Simple script to handle Tag selection logic (max 3)
        document.addEventListener('DOMContentLoaded', () => {
            const tagButtons = document.querySelectorAll('.tag-btn');
            const countDisplay = document.getElementById('tagCount');
            const warningDisplay = document.getElementById('tagWarning');
            let selectedCount = document.querySelectorAll('.tag-btn[data-selected="true"]').length;
            
            // Initialize display
            countDisplay.textContent = selectedCount;

            tagButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const isSelected = this.getAttribute('data-selected') === 'true';
                    
                    if (isSelected) {
                        // Deselect
                        this.setAttribute('data-selected', 'false');
                        this.classList.remove('border-transparent', 'bg-primary', 'text-on-primary');
                        this.classList.add('border-border-subtle', 'bg-surface-container-lowest', 'text-text-muted', 'hover:bg-surface-variant');
                        selectedCount--;
                        warningDisplay.style.display = 'none';
                    } else {
                        // Select (check if already at max)
                        if (selectedCount >= 3) {
                            warningDisplay.style.display = 'block';
                            // Quick shake animation could go here
                            return;
                        }
                        this.setAttribute('data-selected', 'true');
                        this.classList.remove('border-border-subtle', 'bg-surface-container-lowest', 'text-text-muted', 'hover:bg-surface-variant');
                        this.classList.add('border-transparent', 'bg-primary', 'text-on-primary');
                        selectedCount++;
                        if(selectedCount === 3) warningDisplay.style.display = 'none';
                    }
                    
                    countDisplay.textContent = selectedCount;
                });
            });
            
            // Mouse trailer logic
            const trailer = document.getElementById('mouse-trailer');
            
            if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
                let mouseX = 0, mouseY = 0;
                let trailerX = 0, trailerY = 0;
                let isActive = false;
                
                document.addEventListener('mousemove', (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    
                    if (!isActive) {
                        isActive = true;
                        trailer.style.opacity = '1';
                        // Snap to position initially
                        trailerX = mouseX;
                        trailerY = mouseY;
                    }
                });
                
                document.addEventListener('mouseleave', () => {
                    isActive = false;
                    trailer.style.opacity = '0';
                });
                
                function animate() {
                    if (isActive) {
                        // Smoothing factor
                        trailerX += (mouseX - trailerX) * 0.15;
                        trailerY += (mouseY - trailerY) * 0.15;
                        
                        trailer.style.transform = `translate(${trailerX}px, ${trailerY}px) translate(-50%, -50%)`;
                    }
                    requestAnimationFrame(animate);
                }
                
                animate();
            }
        });
    </script>
</body></html>
