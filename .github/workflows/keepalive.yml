name: Supabase keep-alive

# Supabase pauses Free Plan projects after ~7 days of low database activity.
# A daily ping gives roughly 7x headroom so the deployed app never greets a
# visitor with a paused database.
#
# Two caveats worth knowing (see README):
#   1. GitHub disables scheduled workflows in PUBLIC repos after 60 days with no
#      repository activity. This job's own runs do NOT count as activity — only
#      commits do. GitHub emails first; re-enabling is one click.
#   2. Scheduled workflows only run from the default branch, so this file has to
#      be on `main` to fire at all.

on:
  schedule:
    # 06:17 UTC daily (~11:47 IST). Deliberately off-the-hour: GitHub delays
    # scheduled runs most at the top of each hour, and can drop them under load.
    - cron: "17 6 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read # this job only makes an outbound call; it needs nothing else

jobs:
  ping:
    name: Ping Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call ping() via PostgREST RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          body="$(mktemp)"

          # --retry absorbs transient network blips so a flaky minute does not
          # send a false alarm. No --location: a redirect would silently turn
          # this POST into a GET.
          code="$(curl --silent --show-error \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            --output "$body" --write-out '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')"

          echo "HTTP ${code} — $(cat "$body")"

          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP ${code}."
            exit 1
          fi

          # Assert the payload, not just the status. A revoked key or a dropped
          # function can return something 2xx-shaped; without this check the job
          # would stay green while the database quietly paused. A monitor that
          # cannot fail is not a monitor.
          if ! grep -q "pong" "$body"; then
            echo "::error::Reached Supabase but got no 'pong'. Has supabase/ping.sql been run, and is execute granted to anon?"
            exit 1
          fi

          echo "Supabase project is awake."
